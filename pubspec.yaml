name: azulito
description: "Sistema POS e Inventario Multiplataforma para Venezuela (Offline-First Bimoneda)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.8.3
  drift: ^2.24.2
  drift_flutter: ^0.2.4
  uuid: ^4.5.1
  intl: ^0.20.2
  connectivity_plus: ^6.1.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  responsive_framework: ^1.5.1
  auto_size_text: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

